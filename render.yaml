# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service in Singapore with a persistent disk for uploads, payment
# receipts and the SQLite database. Disks need a paid instance type.
services:
  - type: web
    name: theapka
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    disk:
      name: storage
      mountPath: /app/storage/app
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: Theapka
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      # Generate locally with: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Your Render URL (https://theapka.onrender.com) or custom domain.
      - key: APP_URL
        sync: false
      - key: APP_LOCALE
        value: km
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/storage/app/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      # Password-reset emails are only logged until a mail provider is set.
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: PAYMENT_ACCOUNT_NAME
        sync: false
      - key: PAYMENT_ABA_NUMBER
        sync: false
      - key: PAYMENT_BANK_DETAILS
        sync: false
      - key: SUPPORT_TELEGRAM
        sync: false
